name: CI - Análisis de Calidad

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Compilar y ejecutar análisis de calidad
      run: mvn -B clean verify
    
    - name: Subir reporte de JaCoCo
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jacoco-report
        path: target/site/jacoco/
        if-no-files-found: ignore
    
    - name: Subir reporte de Checkstyle
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: checkstyle-report
        path: |
          target/site/checkstyle.html
          target/checkstyle-result.xml
        if-no-files-found: ignore
    
    - name: Subir reporte de PMD
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pmd-report
        path: |
          target/site/pmd.html
          target/site/pmd/
          target/pmd.xml
        if-no-files-found: ignore
    
    - name: Subir reporte de SpotBugs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-report
        path: |
          target/spotbugsXml.xml
          target/site/spotbugs.html
        if-no-files-found: ignore
