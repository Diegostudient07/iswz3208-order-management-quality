# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Define jobs to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  build-and-test:
    # Specify the execution environment with Java support.
    # See: https://circleci.com/docs/guides/execution-managed/executor-intro/ & https://circleci.com/docs/reference/configuration-reference/#executor-job
    docker:
      # Use CircleCI's official Java image with Maven
      - image: cimg/openjdk:17.0

    # Add steps to the job
    # See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#steps-overview & https://circleci.com/docs/reference/configuration-reference/#steps
    steps:
      # Checkout the code as the first step.
      - checkout
      
      # Restore Maven cache to speed up builds
      - restore_cache:
          keys:
            - v1-maven-cache-{{ checksum "pom.xml" }}
            - v1-maven-cache-
      
      # Run Maven clean install and tests
      - run:
          name: "Run Maven build and tests"
          command: mvn clean install -DskipTests=false
      
      # Save Maven cache for future builds
      - save_cache:
          paths:
            - ~/.m2
          key: v1-maven-cache-{{ checksum "pom.xml" }}
      
      # Run tests with detailed reporting
      - run:
          name: "Run tests with Maven"
          command: mvn test
      
      # Store test results for CircleCI dashboard
      - store_test_results:
          path: target/surefire-reports
      
      # Store artifacts (optional - for logs and reports)
      - store_artifacts:
          path: target
          destination: build-output

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  build-and-test-workflow:
    # This workflow runs the build and test job
    jobs:
      - build-and-test
